[package]
name = "OpenE2E"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0"
description = "A work in progress lightweight GUI client written in Rust for secure end-to-end encrypted communication through open, untrusted channels (government messengers, email, etc.)."
readme = "README.md"
repository = "https://codeberg.org/bazelik-dev/OpenE2E"
build = "build.rs"

[features]
# Default build is the CLI. Enable `gui` for the Slint frontend:
#   cargo run --features gui
default = []
gui = ["dep:slint", "dep:arboard"]

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
chrono = "0.4.45"
cipher = "0.5.2"
colorize = "0.1.0"
fjall = "3.1.8"
fluent = "0.17.0"
log = "0.4.33"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
slint = { version = "1.17.1", optional = true, features = ["renderer-software"] }
arboard = { version = "3.6.1", optional = true, default-features = false }
unic-langid = "0.9.6"
vodozemac = "0.10.0"
dirs = "6.0.0"
base64 = "0.23.1"
zeroize = "1.9.0"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
# Isolated temp directories for the fjall database in integration tests.
tempfile = "3"
