version: 2.1

jobs:
  build-windows-cli:
    docker:
      - image: rust:latest
    steps:
      - checkout
      - run:
          name: Install Windows target
          command: rustup target add x86_64-pc-windows-gnu
      - run:
          name: Install mingw-w64
          command: apt-get update && apt-get install -y mingw-w64
      - run:
          name: Build Windows CLI Release
          command: cargo build --release --target x86_64-pc-windows-gnu
      - store_artifacts:
          path: target/x86_64-pc-windows-gnu/release/OpenE2E.exe
          destination: OpenE2E-CLI_win64.exe

  build-windows-gui:
    docker:
      - image: rust:latest
    steps:
      - checkout
      - run:
          name: Install Windows target
          command: rustup target add x86_64-pc-windows-gnu
      - run:
          name: Install mingw-w64
          command: apt-get update && apt-get install -y mingw-w64
      - run:
          name: Build Windows GUI Release
          command: cargo build --release --features gui --target x86_64-pc-windows-gnu
      - store_artifacts:
          path: target/x86_64-pc-windows-gnu/release/OpenE2E.exe
          destination: OpenE2E-GUI_win64.exe

  build-linux-64-cli:
    docker:
      - image: rust:latest
    steps:
      - checkout
      - run:
          name: Build Linux 64-bit CLI Release
          command: cargo build --release --target x86_64-unknown-linux-gnu
      - store_artifacts:
          path: target/x86_64-unknown-linux-gnu/release/OpenE2E
          destination: OpenE2E-CLI_linux64

  build-linux-64-gui:
    docker:
      - image: rust:latest
    steps:
      - checkout
      - run:
          name: Install dependencies for Slint GUI
          command: apt-get update && apt-get install -y libfontconfig1-dev
      - run:
          name: Build Linux 64-bit GUI Release
          command: cargo build --release --features gui --target x86_64-unknown-linux-gnu
      - store_artifacts:
          path: target/x86_64-unknown-linux-gnu/release/OpenE2E
          destination: OpenE2E-GUI_linux64

  build_nix_cli:
    docker:
      - image: nixos/nix:latest
    steps:
      - checkout
      - run:
          name: Build NixOS CLI Release
          command: |
            nix flake update
            nix build .#cli -o result-cli
      - run:
          name: Create CLI tarball
          command: |
            cp -r result-cli OpenE2E-CLI_NixOS
            tar czf OpenE2E-CLI_NixOS.tar.gz OpenE2E-CLI_NixOS/
      - store_artifacts:
          path: OpenE2E-CLI_NixOS.tar.gz
          destination: OpenE2E-CLI_NixOS.tar.gz

  build_nix_gui:
    docker:
      - image: nixos/nix:latest
    steps:
      - checkout
      - run:
          name: Build NixOS GUI Release
          command: |
            nix flake update
            nix build .#gui -o result-gui
      - run:
          name: Create GUI tarball
          command: |
            cp -r result-gui OpenE2E-GUI_NixOS
            tar czf OpenE2E-GUI_NixOS.tar.gz OpenE2E-GUI_NixOS/
      - store_artifacts:
          path: OpenE2E-GUI_NixOS.tar.gz
          destination: OpenE2E-GUI_NixOS.tar.gz

workflows:
  build:
    jobs:
      - build-windows-cli
      - build-windows-gui
      - build-linux-64-cli
      - build-linux-64-gui
      - build_nix_cli
      - build_nix_gui
